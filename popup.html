<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Abas</title>
  <style>
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f8f9fa;
      color: #333;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h3 {
      margin: 0;
      font-size: 15px;
    }
    .actions {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    .btn {
      flex: 1;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #e9ecef;
    }
    .btn-danger {
      color: #dc3545;
      border-color: #f5c6cb;
    }
    .btn-danger:hover {
      background: #f8d7da;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 300px;
      overflow-y: auto;
    }
    .tab-item {
      display: flex;
      align-items: center;
      padding: 8px;
      margin-bottom: 6px;
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tab-item:hover {
      background: #f1f3f5;
    }
    .tab-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      flex-shrink: 0;
    }
    .tab-title {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }
    .close-btn {
      background: none;
      border: none;
      color: #aaa;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .close-btn:hover {
      color: #dc3545;
      background: #f8d7da;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>Gerenciador de Abas</h3>
  </div>

  <div class="actions">
    <button id="remove-duplicates" class="btn">Fechar as Duplicadas</button>
    <button id="close-all" class="btn btn-danger">Fechar Todas</button>
  </div>

  <ul id="tab-list"></ul>

  <script src="popup.js"></script>
</body>
</html>
